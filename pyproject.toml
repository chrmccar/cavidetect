[project]
name = "cavidetect"
version = "0.6.0"
description = "Automated detection of cavitation events in liverwort rhizoid time-lapses"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "tifffile>=2023.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
extra = ["ruptures>=1.1", "scikit-learn>=1.3", "joblib>=1.3", "pystackreg>=0.2", "napari>=0.4"]
dev = ["pytest>=7.4"]
build = ["pyinstaller>=6.0"]

[project.scripts]
cavidetect = "cavidetect.cli:main"
cavidetect-gui = "cavidetect.gui:main"
cavidetect-app = "cavidetect.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cavidetect*"]
